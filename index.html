<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#070a12" />
  <title>Jobsite · Forever Gold</title>
  <link rel="stylesheet" href="app.css?v=20261109c" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <p class="kicker">Forever Gold · Jobsite</p>
        <h1>One job. One folder. Everyone sees it.</h1>
        <p id="companyLine" class="sub">Sample for Scott. Company name not set.</p>
      </div>
    </div>
    <div class="header-actions">
      <div class="roles" role="group" aria-label="Who is looking">
        <button type="button" id="roleOwner" aria-pressed="true">You</button>
        <button type="button" id="roleBook" aria-pressed="false">Bookkeeper</button>
      </div>
      <button type="button" id="reset" class="quiet">Reset sample</button>
    </div>
  </header>
  <main id="stage">
    <canvas id="sky" aria-hidden="true"></canvas>
    <div id="tags" class="tags" aria-label="Parts of the job"></div>
    <nav id="flow" aria-label="How a job moves">
      <div class="flow-head">
        <p class="flow-kicker">How a job moves</p>
        <button type="button" id="tourBtn" class="play"><span aria-hidden="true">&#9654;</span> Walk me through it</button>
      </div>
      <ol id="flowList" class="flow-list"></ol>
    </nav>
    <div class="zone">
      <div id="zoom" class="zoom" role="group" aria-label="Zoom">
        <button type="button" id="zoomOut" aria-label="Zoom out">&minus;</button>
        <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
        <button type="button" id="zoomAll">See all</button>
      </div>
      <section id="tourBar" hidden aria-live="polite" aria-label="Walkthrough">
        <div class="meter" aria-hidden="true"><i id="tourFill"></i></div>
        <p id="tourKicker" class="tour-kicker"></p>
        <h3 id="tourTitle"></h3>
        <p id="tourLine"></p>
        <div class="tour-ctl">
          <button type="button" id="tourPrev">Back</button>
          <button type="button" id="tourPause" class="primary">Pause</button>
          <button type="button" id="tourNext">Next</button>
          <button type="button" id="tourStop" class="quiet">Done</button>
        </div>
      </section>
      <p class="hint">Drag to turn · scroll or pinch to zoom · tap to open · double-tap to close</p>
    </div>
    <section id="dock" aria-label="Details"></section>
  </main>
  <script type="module" src="app.js?v=20261109c"></script>
</body>
</html>
